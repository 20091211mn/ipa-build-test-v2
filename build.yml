name: Build Unsigned IPA — TestApp

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XC_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC_APP" ]; then
            echo "Xcode not found in /Applications" >&2
            exit 1
          fi
          echo "Using Xcode: $XC_APP"
          sudo xcode-select -s "$XC_APP/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project (test only)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve project or workspace
        id: project
        run: |
          INPUT_PATH="TestApp.xcodeproj"
          if [ -d "$INPUT_PATH" ] || [ -f "$INPUT_PATH" ]; then
            echo "path=$INPUT_PATH" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_PATH" == *.xcworkspace ]]; then
              echo "type=-workspace" >> "$GITHUB_OUTPUT"
            else
              echo "type=-project" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Input path not found: $INPUT_PATH — searching repo..."
            FOUND=$(find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | head -1 | sed 's|^\\./||')
            if [ -z "$FOUND" ]; then
              echo "No .xcodeproj or .xcworkspace found" >&2
              exit 1
            fi
            echo "Found: $FOUND"
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            if [[ "$FOUND" == *.xcworkspace ]]; then
              echo "type=-workspace" >> "$GITHUB_OUTPUT"
            else
              echo "type=-project" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List available schemes
        run: |
          xcodebuild "${{ steps.project.outputs.type }}" "${{ steps.project.outputs.path }}" -list

      - name: Build .app bundle (unsigned)
        run: |
          set -e
          mkdir -p build
          xcodebuild \
            "${{ steps.project.outputs.type }}" "${{ steps.project.outputs.path }}" \
            -scheme "TestApp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "${{ github.workspace }}/DerivedData" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_FILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate built .app and package IPA
        run: |
          set -e
          APP_PATH=$(find "${{ github.workspace }}/DerivedData" -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in DerivedData" >&2
            find "${{ github.workspace }}/DerivedData" -type d >&2 || true
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "TestApp.ipa" Payload
          ls -lh "TestApp.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-ipa
          path: "TestApp.ipa"
